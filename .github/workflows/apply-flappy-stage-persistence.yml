name: Apply Flappy stage persistence fix

on:
  push:
    branches:
      - agent/flappy-game-points-queue-fix
    paths:
      - .github/workflows/apply-flappy-stage-persistence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flappy-game-points-queue-fix

      - name: Patch Flappy stages and persistent points
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("worker.js")
          source = path.read_text()

          source = source.replace(
              "STAGE N requires N * 5 real pipes / official PTS.",
              "STAGE N requires N real pipes / official PTS.",
              1,
          )

          if "pipes_target: stage * 5," not in source:
              raise SystemExit("Expected stage x 5 target not found")
          source = source.replace("pipes_target: stage * 5,", "pipes_target: stage,", 1)

          pattern = re.compile(
              r'  await env\.GAME_POINTS_QUEUE\.send\(\{\n(.*?)\n  \}\);\n\n  /\*\n    El nuevo recibo',
              re.S,
          )
          match = pattern.search(source)
          if not match:
              raise SystemExit("Expected GAME_POINTS_QUEUE.send block not found")

          event_body = match.group(1)
          replacement = f'''  const progressEvent = {{\n{event_body}\n  }};\n\n  let queued = false;\n  let confirmed = false;\n\n  const queueAvailable =\n    !!env.GAME_POINTS_QUEUE &&\n    typeof env.GAME_POINTS_QUEUE.send === "function";\n\n  if (queueAvailable) {{\n    try {{\n      await env.GAME_POINTS_QUEUE.send(progressEvent);\n      queued = true;\n    }} catch (error) {{\n      console.warn("[GAME POINTS QUEUE SEND FAILED]", {{\n        game_uid: gameUid,\n        game_type: game.id,\n        message: String(error?.message || error)\n      }});\n    }}\n  }}\n\n  /*\n    El finish confirma en D1 antes de responder.\n    Si Queue no está disponible, los checkpoints también\n    usan D1 como fallback para no perder PTS.\n\n    consolidateGamePointsEvent() es idempotente por\n    game_uid + métrica acumulada, por lo que el mensaje\n    posterior de Queue no duplica puntos.\n  */\n  if (final === true || queued === false) {{\n    await consolidateGamePointsEvent(env, progressEvent);\n    confirmed = true;\n  }}\n\n  /*\n    El nuevo recibo'''
          source = source[:match.start()] + replacement + source[match.end():]

          return_old = '''  return {\n    queued: true,\n    final: final === true,'''
          return_new = '''  return {\n    queued,\n    confirmed,\n    final: final === true,'''
          if return_old not in source:
              raise SystemExit("Expected enqueue return block not found")
          source = source.replace(return_old, return_new, 1)

          sync_pattern = re.compile(
              r'sync_status:\n\s*progress\.queued\n\s*\? "queued"\n\s*: "unchanged",'
          )
          source, sync_count = sync_pattern.subn(
              'sync_status:\n      progress.confirmed\n        ? "confirmed"\n        : progress.queued\n          ? "queued"\n          : "unchanged",',
              source,
          )
          if sync_count < 2:
              raise SystemExit(f"Expected at least 2 sync_status blocks, found {sync_count}")

          points_sync_pattern = re.compile(
              r'points_sync_status:\n\s*progress\.queued\n\s*\? "queued"\n\s*: "unchanged",'
          )
          source = points_sync_pattern.sub(
              'points_sync_status:\n          progress.confirmed\n            ? "confirmed"\n            : progress.queued\n              ? "queued"\n              : "unchanged",',
              source,
          )

          path.write_text(source)
          PY

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Flappy stage progression and point persistence"
          git push origin HEAD:agent/flappy-game-points-queue-fix