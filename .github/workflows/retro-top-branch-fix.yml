name: Apply Retro top whitelist fix

on:
  push:
    branches:
      - agent/flappy-game-points-queue-fix
    paths:
      - .github/workflows/retro-top-branch-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flappy-game-points-queue-fix
          fetch-depth: 0

      - name: Add flappy_retro to game top whitelist
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('worker-entry.js')
          text = path.read_text(encoding='utf-8')

          old = '''const GAME_TOP_TYPES = new Set([
  "flappy_classic", "webcam_flappy", "finger_trace", "fruits_memory",'''
          new = '''const GAME_TOP_TYPES = new Set([
  "flappy_classic", "flappy_retro", "webcam_flappy", "finger_trace", "fruits_memory",'''

          if '"flappy_classic", "flappy_retro", "webcam_flappy"' not in text:
              if old not in text:
                  raise SystemExit('GAME_TOP_TYPES insertion point not found')
              text = text.replace(old, new, 1)

          if '"flappy_classic", "flappy_retro", "webcam_flappy"' not in text:
              raise SystemExit('Retro top whitelist marker missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check worker-entry.js

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "FlappyPi Retro Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/retro-top-branch-fix.yml
          git add worker-entry.js
          git commit -m "fix(retro): allow flappy retro game leaderboard"
          git push origin HEAD:agent/flappy-game-points-queue-fix
