name: Apply Flappy Classic 999 stages

on:
  push:
    branches:
      - agent/flappy-game-points-queue-fix
    paths:
      - scripts/apply-flappy-classic-999.mjs
      - .github/workflows/apply-flappy-classic-999.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flappy-game-points-queue-fix

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch Worker
        run: node scripts/apply-flappy-classic-999.mjs

      - name: Validate Worker syntax
        run: node --check worker.js

      - name: Commit generated Worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          if git diff --cached --quiet; then
            echo "No Worker changes to commit"
            exit 0
          fi
          git commit -m "Configure Flappy Classic 999 stages"
          git push origin HEAD:agent/flappy-game-points-queue-fix
