name: Apply Finger Trace stage server
on:
  push:
    branches: [agent/flappy-game-points-queue-fix]
  workflow_dispatch:
jobs:
  apply:
    if: github.actor != 'flappypi-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flappy-game-points-queue-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch authoritative stage rules
        shell: python
        run: |
          from pathlib import Path

          path = Path('worker.js')
          text = path.read_text()

          text = text.replace(
              'STAGE N requires N real pipes / official PTS.',
              'STAGE N requires N * 5 real pipes / official PTS.',
              1
          )
          text = text.replace('pipes_target: stage,', 'pipes_target: stage * 5,', 1)

          old_finger = '''  finger_trace: makeGame({
    scoringVersion: "finger-trace-score-v1",
    maxLevel: 999,
    maxScorePerSec: 100
  }),'''
          new_finger = '''  finger_trace: makeGame({
    scoringVersion: "finger-trace-score-v2-stages",
    maxLevel: 999,
    maxScorePerSec: 12,
    completionValidator: "finger_score",
    levelProgression: true,
    levelRewardEnabled: false
  }),'''
          if old_finger in text:
              text = text.replace(old_finger, new_finger, 1)
          elif 'scoringVersion: "finger-trace-score-v2-stages"' not in text:
              raise SystemExit('finger game definition marker not found')

          anchor = '''function calcDurationSec(payloadStartedAt) {
  return (Date.now() - Number(payloadStartedAt)) / 1000;
}

'''
          validator = '''function getFingerStageTarget(levelId) {
  const level = Math.max(1, Math.min(999, Number(levelId) || 1));
  return Math.min(50, 5 + Math.floor((level - 1) / 20));
}

function validateFingerCompleteAttempt({ payload, body }) {
  const levelId = Number(payload?.level_id || 0);
  const mode = String(payload?.mode || "infinity");
  const officialScore = Number(body?.score || 0);

  if (mode !== "levels" || !Number.isInteger(levelId) || levelId < 1 || levelId > 999) {
    return {
      ok: false,
      forcedComplete: false,
      reason: "FINGER_STAGE_CONTEXT_INVALID",
      meta: { level_id: levelId, mode }
    };
  }

  const target = getFingerStageTarget(levelId);
  if (!Number.isInteger(officialScore) || officialScore < target) {
    return {
      ok: false,
      forcedComplete: false,
      reason: "FINGER_SCORE_BELOW_TARGET",
      meta: { level_id: levelId, score: officialScore, target }
    };
  }

  const durationSec = calcDurationSec(payload?.startedAt);
  const minimumDurationSec = Math.max(2, target * 0.18);
  if (!Number.isFinite(durationSec) || durationSec < minimumDurationSec) {
    return {
      ok: false,
      forcedComplete: false,
      reason: "FINGER_COMPLETE_TOO_FAST",
      meta: { level_id: levelId, score: officialScore, target, durationSec, minimumDurationSec }
    };
  }

  if (officialScore > durationSec * 12 + 3) {
    return {
      ok: false,
      forcedComplete: false,
      reason: "FINGER_SCORE_TIME_ANOMALY",
      meta: { level_id: levelId, score: officialScore, target, durationSec }
    };
  }

  return {
    ok: true,
    forcedComplete: true,
    reason: null,
    meta: { level_id: levelId, score: officialScore, target, durationSec }
  };
}

'''
          if 'function validateFingerCompleteAttempt' not in text:
              if anchor not in text:
                  raise SystemExit('validator anchor not found')
              text = text.replace(anchor, anchor + validator, 1)

          old_check = '''        const completeCheck = game.completionValidator === "flappy_pipes"
            ? validateCompleteGameAttempt({ payload, body: { ...body, score } })
            : {
                ok: false,
                forcedComplete: false,
                reason: "COMPLETE_VALIDATOR_NOT_CONFIGURED",
                meta: { game_type: game.id }
              };'''
          new_check = '''        const completeCheck = game.completionValidator === "flappy_pipes"
            ? validateCompleteGameAttempt({ payload, body: { ...body, score } })
            : game.completionValidator === "finger_score"
              ? validateFingerCompleteAttempt({ payload, body: { ...body, score } })
              : {
                  ok: false,
                  forcedComplete: false,
                  reason: "COMPLETE_VALIDATOR_NOT_CONFIGURED",
                  meta: { game_type: game.id }
                };'''
          if old_check in text:
              text = text.replace(old_check, new_check, 1)
          elif 'validateFingerCompleteAttempt({ payload' not in text:
              raise SystemExit('completion validator switch marker not found')

          path.write_text(text)

          photo = Path('game-photo.worker.js')
          ptext = photo.read_text()
          ptext = ptext.replace(
              'const STAGE_STAR_GAMES = new Set(["flappy_classic", "webcam_flappy"]);',
              'const STAGE_STAR_GAMES = new Set(["flappy_classic", "webcam_flappy", "finger_trace"]);',
              1
          )
          photo.write_text(ptext)

          platform = Path('platform.worker.js')
          platform_text = platform.read_text()
          platform_text = platform_text.replace(
              'const apiKey = safeText(env.PI_API_KEY, 300);',
              'const apiKey = safeText(env.PI_SERVER_API_KEY || env.PI_API_KEY, 300);',
              1
          )
          platform.write_text(platform_text)
      - name: Syntax check
        run: |
          node --check worker.js
          node --check platform.worker.js
          node --check game-photo.worker.js
      - name: Commit server rules
        run: |
          git config user.name "flappypi-agent"
          git config user.email "actions@users.noreply.github.com"
          git add worker.js game-photo.worker.js platform.worker.js
          if git diff --cached --quiet; then
            echo "No server changes"
            exit 0
          fi
          git commit -m "Add authoritative Finger Trace stages and restore Flappy targets"
          git push origin HEAD:agent/flappy-game-points-queue-fix
